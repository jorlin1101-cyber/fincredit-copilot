# This project was developed with assistance from AI tools.
#
# MkDocs configuration for FinCredit Copilot documentation.
# Build locally: mkdocs serve
# Deploy:        GitHub Actions (.github/workflows/docs.yml)

site_name: FinCredit Copilot
site_description: 面向中国住房金融场景的智能授信辅助平台
repo_url: https://github.com/jorlin1101-cyber/fincredit-copilot
repo_name: jorlin1101-cyber/fincredit-copilot
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - 首页: index.md
  - 系统架构: fincredit-architecture.md
  - 角色与流程: personas.md
  - API 参考: api-reference.md
  - 评估说明: evaluation-report.md
  - 故障演练: failure-drills.md
