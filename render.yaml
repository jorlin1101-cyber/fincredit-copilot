databases:
  - name: fincredit-demo-db-20261010
    plan: free
    region: singapore
    databaseName: fincredit_demo_db_20261010
    user: fincredit_demo_db_20261010_user
    postgresMajorVersion: "18"

services:
  - type: web
    name: fincredit-demo-storage
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./packages/storage/Containerfile
    dockerContext: .
    healthCheckPath: /minio/health/live
    envVars:
      - key: MINIO_ROOT_USER
        value: fincredit-demo
      - key: MINIO_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: fincredit-demo-mcp
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./packages/api/Containerfile
    dockerContext: .
    dockerCommand: python -m src.mcp_server
    healthCheckPath: /health

  - type: web
    name: fincredit-demo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./packages/api/Containerfile
    dockerContext: .
    dockerCommand: /bin/sh /app/packages/api/render-start.sh
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_CONNECTION_STRING
        fromDatabase:
          name: fincredit-demo-db-20261010
          property: connectionString
      # Cloudflare R2: pre-create a private Standard bucket before applying this config.
      # Existing services require these sync:false values to be set separately in Render.
      # Keep S3_HOSTPORT empty so it cannot override the R2 HTTPS endpoint.
      - key: S3_HOSTPORT
        value: ""
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: fincredit-documents
      - key: S3_UPLOAD_CHECKSUM
        value: md5
      - key: S3_AUTO_CREATE_BUCKET
        value: "false"
      - key: MCP_HOSTPORT
        fromService:
          type: web
          name: fincredit-demo-mcp
          property: hostport
      - key: AUTH_DISABLED
        value: "true"
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: COMPANY_NAME
        value: 融安住房金融（虚构演示机构）
      - key: AGENT_NAME
        value: 小融
      - key: MLFLOW_TRACKING_URI
        value: ""

  - type: web
    name: fincredit-copilot-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./packages/ui/Containerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        fromService:
          type: web
          name: fincredit-demo-api
          property: hostport
      - key: KEYCLOAK_EXTERNAL
        value: ""
      - key: COMPANY_NAME
        value: 融安住房金融（虚构演示机构）
      - key: AGENT_NAME
        value: 小融
      - key: API_WAKE_URL
        value: https://fincredit-demo-api.onrender.com/health/
