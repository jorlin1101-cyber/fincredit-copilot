# Model configuration for FinCredit Copilot.
#
# Hot-reloaded per conversation via mtime check -- no restart required.
#
# The 'vision' tier is optional. When VISION_MODEL / VISION_BASE_URL are
# unset or empty, vision calls fall back to the main 'llm' tier.

routing:
  default_tier: llm

models:
  llm:
    provider: openai_compatible
    model_name: "${LLM_MODEL:-qwen3.7-plus}"
    description: "Qwen text model for agent reasoning and tool use"
    endpoint: "${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    api_key: "${LLM_API_KEY:-}"
  vision:
    provider: openai_compatible
    model_name: "${VISION_MODEL:-qwen3-vl-flash}"
    description: "Qwen-VL model for scanned Chinese document extraction"
    endpoint: "${VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    api_key: "${VISION_API_KEY:-}"
  embedding:
    provider: "${EMBEDDING_PROVIDER:-openai_compatible}"
    model_name: "${EMBEDDING_MODEL:-text-embedding-v4}"
    description: "Bailian multilingual embedding model for controlled RAG"
    endpoint: "${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    api_key: "${EMBEDDING_API_KEY:-}"
    # The database uses Vector(768). The provider must request and return
    # exactly this dimension; startup/ingestion validation rejects mismatches.
    dimensions: "${EMBEDDING_DIMENSIONS:-768}"
