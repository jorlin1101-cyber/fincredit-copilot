name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mortgage-ai/ui lint
      - run: pnpm --filter @mortgage-ai/ui type-check
      - run: pnpm --filter @mortgage-ai/ui test
      - run: pnpm --filter @mortgage-ai/ui build:vite

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    env:
      PYTHONPATH: src:../db/src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest -q -p no:cacheprovider --ignore=tests/integration
